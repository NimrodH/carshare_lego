        /**
         * Safe polling loop:
         * - no overlapping runs
         * - next tick scheduled after the previous finishes (drift-aware)
         * - returns { stop() } handle
         * intervalArg can be a number (ms) or a function () => number to allow adaptive intervals.
         */
        function startSafePoll(pollFn, intervalArg, label = "poll") {
            let stopped = false;
            let inFlight = false;

            async function loop() {
                if (stopped) return;

                // get interval (support function for adaptive intervals)
                const intervalMs = (typeof intervalArg === "function") ? intervalArg() : intervalArg;

                if (inFlight) {
                    setTimeout(loop, intervalMs);
                    return;
                }

                inFlight = true;
                const t0 = Date.now();
                try {
                    await pollFn();
                } catch (e) {
                    console.error(`[${label}] error:`, e);
                } finally {
                    inFlight = false;
                    const elapsed = Date.now() - t0;
                    const drift = Math.max(0, intervalMs - elapsed);
                    setTimeout(loop, drift);
                }
            }

            // kick off
            setTimeout(loop, 0);

            return {
                stop() { stopped = true; }
            };
        }

        class Deduplicator {
            constructor(ttlMs = 5 * 60 * 1000) {  // default: remember IDs for 5 minutes
                this.seen = new Set();
                this.ttl = ttlMs;
            }

            /**
             * Returns true if id is new (and registers it), or false if it was seen before.
             */
            checkAndMark(id) {
                if (this.seen.has(id)) return false; /// already seen
                // mark as seen
                this.seen.add(id);
                // schedule automatic forgetting after TTL
                setTimeout(() => this.seen.delete(id), this.ttl);
                return true;
            }
        }
        const deduper = new Deduplicator(2 * 60 * 1000);  // e.g. 2 min TTL

                async sendWithAck(payload, sender, timeout = 750) {
                    const { messageId } = payload;

                    try {
                        return await new Promise((resolve, reject) => {
                            try {
                                this.pending.set(messageId, { resolve, reject });

                                // Attempt to send the message
                                this.socket.send(JSON.stringify(payload));
                                console.log(`Message sent with ID: ${messageId} by ${sender}`);

                                setTimeout(() => {
                                    if (this.pending.has(messageId)) {
                                        this.pending.delete(messageId);
                                        console.warn(`ACK timeout for message ID: ${messageId}`);
                                        reject(new Error("ACK timeout"));
                                    }
                                }, timeout);

                            } catch (sendError) {
                                console.error(`Failed to send message with ID: ${messageId}`, sendError);
                                reject(sendError);
                            }
                        });
                    } catch (err) {
                        console.error(`sendWithAck failed for message ID: ${messageId}`, err);
                        throw err; // rethrow to let caller handle it
                    }
                }

                async safeSend(data, sender, maxRetries = 3, retryDelay = 500) {
                    const messageId = `msg-${++this.counter}${sender}`;
                    const payload = { ...data, messageId };

                    for (let attempt = 1; attempt <= maxRetries; attempt++) {
                        try {
                            const result = await this.sendWithAck(payload, sender); // new ID each time!

        async function getData(route, queryParam = "") {
            const baseURL = 'https://t8l4i3853e.execute-api.us-east-1.amazonaws.com/V1/';
            const fullURL = `${baseURL}${route}${queryParam}`;
            console.log("getData fullURL:", fullURL);

            for (let attempt = 1; attempt <= 2; attempt++) {
                try {
                    const response = await fetch(fullURL, { method: 'GET', headers: { 'Accept': 'application/json' } });
                    if (!response.ok) {
                        console.error(`Server error: ${response.status}`);
                        const errorText = await response.text().catch(() => "");
                        console.error('Error body:', errorText);
                        return {};
                    }
                    const data = await response.json();
                    console.log('Response data:', data);
                    return data;
                } catch (error) {
                    console.error(`Network error (attempt ${attempt}):`, error);
                    if (attempt < 2) await new Promise(r => setTimeout(r, 400)); // short backoff
                }
            }
            return {};
        }

        async function patchData(avatarID, field, value, opts = {}) {
            const baseURL = 'https://t8l4i3853e.execute-api.us-east-1.amazonaws.com/V1'; // no trailing slash
            const route = `avatars/${encodeURIComponent(avatarID)}`;                       // no leading slash
            const url = `${baseURL}/${route}`;

            const body = { field, value };

            try {
                const response = await fetch(url, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                    keepalive: !!opts.keepalive,  // <— allow keepalive during unload
                });

                // In unload flows, you may not get a readable body — guard parse
                let result = null;
                try { result = await response.json(); } catch { }

                if (!response.ok) {
                    console.error("❌ Error updating avatar:", (result && (result.error || result)) || response.status);
                    throw new Error((result && (result.error || "Update failed")) || `HTTP ${response.status}`);
                }

                console.log("✅ Avatar updated:", result);
                return result;
            } catch (error) {
                console.error("❗ Network or server error:", error);
                throw error;
            }
        }

        /////////// CREATE SCENE ///////////////////////////
        var createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            ///not in use?
            const gravityVector = new BABYLON.Vector3(0, -9.8, 0);
            const physicsPlugin = new BABYLON.CannonJSPlugin();
            scene.enablePhysics(gravityVector, physicsPlugin);

            ///CAMERA///
            ///////const camera = new BABYLON.ArcRotateCamera("Camera", - Math.PI / 2, Math.PI / 2, 1, BABYLON.Vector3.Zero());///used only for taking pics
            camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 1, 0), scene);///used for VR(0, 5, -7) was 3
            camera.setTarget(new BABYLON.Vector3(0, 1, 1));///used for VR (0, 4, -15)
            camera.attachControl(canvas, true);///used always
            // Disable mouse look (pointer movement)
            camera.inputs.removeByType("FreeCameraMouseInput");

            ///end camera///
            /// Event listener for pointer clicks

            const maxR = 5; // Maximum radius of the circle , same as the ground size
            let R = 0; // Current (smoothed) radius of the circle - 0 is the original overview point
            let targetR = 0; // Radius the scroll wheel is walking us toward
            let angle = BABYLON.Tools.ToRadians(90); // Current (smoothed) angle in radians
            let targetAngle = angle; // Angle the mouse-button rotation is walking us toward
            const rotationSpeed = BABYLON.Tools.ToRadians(20); // Rotation step per click
            const moveSpeed = 1; // Radius step per wheel tick
            const rWalkSpeed = 4; // units/sec - how fast R eases toward targetR (the "walking" speed)
            const angleWalkSpeed = BABYLON.Tools.ToRadians(90); // rad/sec - how fast angle eases toward targetAngle

            const baseCameraY = 1; // camera height at the original point (R = 0), unchanged from before
            // Approx world height of the TOP edge of the green sign, which now floats
            // above the avatar's head instead of at chest height (see avatar.js
            // matchUser: avatarHeadTopY(~1.8) + 0.3 gap + planeSize/2(~0.43)).
            const signTopY = 2.5;

            // Move `current` toward `target` by at most `maxDelta`, without overshooting.
            function moveTowards(current, target, maxDelta) {
                if (Math.abs(target - current) <= maxDelta) return target;
                return current + Math.sign(target - current) * maxDelta;
            }

            // Function to update the camera position based on the current angle and radius
            function updateCameraPosition() {
                camera.position.x = R * Math.cos(angle);
                camera.position.z = R * Math.sin(angle);

                // 0 = original point (R = 0), 1 = walked all the way in to the sign (R = maxR)
                const zoomT = BABYLON.Scalar.Clamp(R / maxR, 0, 1);
                // Raise the camera and its look-at point together as the user walks
                // in, so the upper edge of the green sign stays in view instead of
                // sliding above the frame as the avatar gets closer/taller-looking.
                camera.position.y = BABYLON.Scalar.Lerp(baseCameraY, signTopY - 0.4, zoomT);

                // Extend the target point outward from the center
                const targetDistance = R + 2; // 2 units further out to define the facing direction
                const targetX = targetDistance * Math.cos(angle);
                const targetZ = targetDistance * Math.sin(angle);
                const targetY = BABYLON.Scalar.Lerp(baseCameraY - 0.2, signTopY, zoomT);

                // Make the camera face outward (away from the center)
                camera.setTarget(new BABYLON.Vector3(targetX, targetY, targetZ));
            }

            // Every frame, smoothly walk R and angle toward whatever the wheel/mouse
            // clicks last requested, instead of snapping instantly. This keeps the
            // sign framing (tied to R via zoomT above) changing gradually too, so its
            // upper edge never pops in/out of frame, and lets a rotation (moving to
            // look at a different avatar) blend together with an in-progress zoom.
            scene.onBeforeRenderObservable.add(() => {
                const dt = engine.getDeltaTime() / 1000;
                const rChanged = R !== targetR;
                const angleChanged = angle !== targetAngle;
                if (!rChanged && !angleChanged) return;
                R = moveTowards(R, targetR, rWalkSpeed * dt);
                angle = moveTowards(angle, targetAngle, angleWalkSpeed * dt);
                updateCameraPosition();
            });

            // Event listener for pointer clicks
            scene.onPointerDown = function (evt, pickResult) {
                // Check if the clicked mesh is the ground or skybox  
                if (myWorld.allowPointer) {
                    if (pickResult.hit && (pickResult.pickedMesh === ground || pickResult.pickedMesh === skybox)) {
                        if (evt.button === 2) {
                            // Move camera clockwise
                            targetAngle -= rotationSpeed;
                        } else if (evt.button === 0) {
                            // Move camera counter-clockwise
                            targetAngle += rotationSpeed;
                        }
                    }
                }
            };

            // Event listener for mouse wheel to zoom in and out
            scene.onPointerObservable.add((pointerInfo) => {
                switch (pointerInfo.type) {
                    case BABYLON.PointerEventTypes.POINTERWHEEL:
                        if (!myWorld.allowPointer) {
                            pointerInfo.event.preventDefault();
                            return; // Ignore zoom if pointer is not allowed
                        }

                        const event = pointerInfo.event;
                        //console.log("event.deltaY: " + event.deltaY);
                        if (event.deltaY < 0) {
                            // Walk in toward the sign
                            targetR += moveSpeed;
                        } else {
                            // Walk back out toward the original point
                            targetR -= moveSpeed;
                        }
                        targetR = BABYLON.Scalar.Clamp(targetR, 0, maxR);
                        event.preventDefault();
                        break;

                    //case BABYLON.PointerEventTypes.POINTERMOVE:
                    ///this not work. we use: camera.inputs.removeByType("FreeCameraMouseInput");
                    // Ignore movement
                    //pointerInfo.event.preventDefault();
                    //break;
                }
            });

            // Initial camera position update
            //updateCameraPosition();


            ////////////////
            ///LIGHT///
            const light1 = new BABYLON.DirectionalLight("DirectionalLight", new BABYLON.Vector3(0, -1, 1));
            const light2 = new BABYLON.HemisphericLight("HemiLight", new BABYLON.Vector3(0, 1, 0));
            light1.intensity = 0.75;
            light2.intensity = 0.5;
            ///END LIGHT///

            ///SKYBOX///
            let startSkyFiles = "textures/pink";
            const skybox = BABYLON.MeshBuilder.CreateBox("skyBox", { size: 1000.0 }, scene);
            const skyboxMaterial = new BABYLON.StandardMaterial("skyBox", scene);
            skyboxMaterial.backFaceCulling = false;
            skyboxMaterial.reflectionTexture = new BABYLON.CubeTexture(startSkyFiles, scene);
            skyboxMaterial.reflectionTexture.coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
            skyboxMaterial.diffuseColor = new BABYLON.Color3(0, 0, 0);
            skyboxMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            skybox.material = skyboxMaterial;
            ///end SKYBOX///

            ///GROUND///
            ///ground is global to allow changing its line color in changeSky()
            ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 1000, height: 1000 }, scene);
            ground.physicsImpostor = new BABYLON.PhysicsImpostor(ground, BABYLON.PhysicsImpostor.BoxImpostor, { mass: 0, friction: 0.8, restitution: 0.5, disableBidirectionalTransformation: true }, scene);///not needed
            ground.checkCollisions = true;///not needed
            ground.material = new BABYLON.GridMaterial("mat", scene);
            ////////ground.material.lineColor = colorName2Vector("base");
            //ground.material.Color3 = new BABYLON.Color3(1, 0, 0);
            ///end GROUND///

            var environment = scene.createDefaultEnvironment({ createGround: false, skyboxSize: 1000 });////V
            environment.setMainColor(BABYLON.Color3.FromHexString("#74b9ff"));

            ///INIT///

            myWorld = await new World(scene);

            // WebXR requires HTTPS (or localhost) - don't let it reject and break scene init when served over plain http/LAN IP.
            try {
                const xr = await scene.createDefaultXRExperienceAsync({
                    floorMeshes: [ground]
                });
                xr.pointerSelection.laserPointerDefaultColor = new BABYLON.Color3(1, 1, 0); //....
            } catch (e) {
                console.warn("WebXR unavailable, continuing without it:", e);
            }
            return scene;
        };
        /////// END CREATE SCENE ////////////

        window.initFunction = async function () {
            var asyncEngineCreation = async function () {
                try {
                    return createDefaultEngine();
                } catch (e) {
                    //console.log("the available createEngine function failed. Creating the default engine instead");
                    return createDefaultEngine();
                }
            }

            window.engine = await asyncEngineCreation();
            if (!engine) throw 'engine should not be null.';
            startRenderLoop(engine, canvas);

            window.scene = await createScene();
            ///////////
            // Assuming you have a WebXR experience set up
            window.scene.onBeforeRenderObservable.add(() => {
                const xrInput = scene.activeCamera.inputs.attached.webVR || scene.activeCamera.inputs.attached.webXR;

                if (xrInput) {
                    xrInput.controllers.forEach(controller => {
                        if (controller.inputSource.gamepad) {
                            camera.position = new BABYLON.Vector3(0, 5, -7);
                            const buttons = controller.inputSource.gamepad.buttons;

                            // Check if button A is pressed
                            if (buttons[0].pressed) {
                                // React to button A being pressed
                                //console.log("Button A pressed");
                                camera.position = new BABYLON.Vector3(0, 5, -7);
                                // Add your action here
                            }
                        }
                    });
                }
            });


            /////////////            

        };

        // #endregion
        initFunction().then(async () => {
            sceneToRender = scene
            //await onServerConnect(scene);///////////////////test
            //await onServerConnect(scene);///////////////////test
            //await onServerConnect(scene);///////////////////test
        });

        // Resize
        window.addEventListener("resize", function () {
            engine.resize();
        });


    </script>
</body>
